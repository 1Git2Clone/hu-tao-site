<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Personal portfolio page featuring my projects and blogs."
    />

    <!-- OpenGraph Meta tags -->
    <meta property="og:title" content="1Git2Clone's personal portfolio" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://1g2c.netlify.app/" />
    <meta
      property="og:image"
      content="https://1g2c.netlify.app/og-image.jpg"
    />
    <meta property="og:image:type" content="image/jpg" />
    <meta property="og:image:width" content="300" />
    <meta property="og:image:height" content="300" />
    <meta
      property="og:image:alt"
      content="1Git2Clone's portfolio page icon"
    />
    <meta
      property="og:description"
      content="Personal portfolio page featuring my projects and blogs."
    />

		%sveltekit.head%

    <link
      rel="preload"
      href="/fonts/JetBrainsMonoNerdFont-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="/fonts/font.css"
    />
    <link
      rel="stylesheet"
      href="/katex.css"
    />
    <link rel="preconnect" href="https://i.ytimg.com">
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
