<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%

    <!-- No font preload: with the CSS inlined, @font-face is found just as early, and the
		     preload made Chrome often hold back the first paint by one to two seconds. -->
    <link rel="icon" href="/favicon.ico" />

    <link
      rel="preload"
      as="image"
      href="/images/bg.webp"
      fetchpriority="high"
    />
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
