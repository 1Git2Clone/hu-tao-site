[build]
command = "npm install -g --force pnpm@${PNPM_PIN} && pnpm run build"
publish = "build"

[build.environment]
NODE_VERSION = "26.10.0"
# NOTE: Make sure to update this every time you do `nix flake update`.
PNPM_PIN = "12.3.4"

# PR deployments include test data. Production leaves this disabled.
[context.deploy-preview.environment]
VITE_INCLUDE_TEST_DATA = "true"

# About Me was merged into the homepage.
[[redirects]]
from = "/about-me"
to = "/"
status = 301

# Fonts keep their name when scripts/development/install-required-font-symbols.sh re-subsets them,
# so a week rather than immutable: repeat visits skip the revalidation round
# trip, and a new subset still reaches everyone within days.
[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
