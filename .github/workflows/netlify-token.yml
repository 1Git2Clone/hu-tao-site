name: Netlify token

on:
  push:
    branches: [main]
  pull_request:
  # Daily, so it fails a week out even when nothing is being pushed.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_TOKEN_EXPIRES: ${{ vars.NETLIFY_TOKEN_EXPIRES }}
        run: scripts/check-netlify-token.sh
