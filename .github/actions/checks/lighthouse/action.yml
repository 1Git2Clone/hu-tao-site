name: Lighthouse
description: Measures one page profile on its own runner.

inputs:
  mode:
    description: Use smoke for one head-only audit per profile; otherwise run the full comparison.
    default: full
  profile:
    description: The exact Lighthouse profile name.
    required: true
  artifact:
    description: Unique artifact name for this profile.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
    # The lockfile pins this Chromium, so the browser changes only with it.
    - run: pnpm exec playwright install --with-deps chromium
      shell: bash
    - if: inputs.mode != 'smoke'
      run: scripts/ci/performance-baseline.sh "$RUNNER_TEMP/baseline" build
      shell: bash
    - if: inputs.mode != 'smoke'
      run: node scripts/checks/performance-bench.ts lighthouse "$RUNNER_TEMP/baseline" . --profile "$LIGHTHOUSE_PROFILE" --out "$RUNNER_TEMP/performance/lighthouse.json"
      shell: bash
      env:
        LIGHTHOUSE_PROFILE: ${{ inputs.profile }}
    - if: inputs.mode == 'smoke'
      run: node scripts/checks/performance-bench.ts lighthouse-smoke . --profile "$LIGHTHOUSE_PROFILE" --out "$RUNNER_TEMP/performance/lighthouse.json"
      shell: bash
      env:
        LIGHTHOUSE_PROFILE: ${{ inputs.profile }}
    - if: always()
      run: node scripts/ci/performance-report.ts "$RUNNER_TEMP/performance" "$RUNNER_TEMP/performance/report"
      shell: bash
    - if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/performance/
        if-no-files-found: ignore
        retention-days: 14
