name: Browser tests
description: Svelte component contracts and production page behaviour in Chromium.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
    - run: pnpm exec playwright install --with-deps chromium
      shell: bash
    - run: pnpm run test:components
      shell: bash
    - run: pnpm run build
      shell: bash
    - run: pnpm run test:e2e
      shell: bash
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: browser-failures
        path: |
          test-results/
          .vitest/attachments/
